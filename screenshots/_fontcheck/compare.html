<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Figtree';font-weight:300;src:url('figtree-300.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-weight:400;src:url('figtree-400.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-weight:500;src:url('figtree-500.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-weight:600;src:url('figtree-600.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-weight:700;src:url('figtree-700.woff2') format('woff2')}
body{margin:0;padding:40px;background:#eee9e5;color:#333}
.row{margin:0 0 6px}
.lbl{font:600 12px/1 sans-serif;color:#0f6e59;letter-spacing:.1em;text-transform:uppercase;margin:26px 0 8px}
img{display:block;height:90px;margin-bottom:4px}
.fig{font-family:'Figtree';color:#333;line-height:1.05}
.big{font-size:62px}
.mid{font-size:34px}
.small{font-size:20px;color:#c2ab8f;letter-spacing:.42em;font-weight:300}
</style></head><body>
<div class="lbl">Echtes Logo (Original)</div>
<img src="../../assets/logo.svg" alt="logo">

<div class="lbl">Figtree – PHYSIOTHERAPIE (Schnitte 400 / 500 / 600)</div>
<div class="row fig big" style="font-weight:400;letter-spacing:.01em">PHYSIOTHERAPIE</div>
<div class="row fig big" style="font-weight:500;letter-spacing:.01em">PHYSIOTHERAPIE</div>
<div class="row fig big" style="font-weight:600;letter-spacing:.01em">PHYSIOTHERAPIE</div>

<div class="lbl">Figtree – MARTIN KREBBER (500 / 600)</div>
<div class="row fig mid" style="font-weight:500;letter-spacing:.02em">MARTIN KREBBER</div>
<div class="row fig mid" style="font-weight:600;letter-spacing:.02em">MARTIN KREBBER</div>

<div class="lbl">Figtree – PRIVATPRAXIS (300, weit gesperrt)</div>
<div class="row fig small">PRIVATPRAXIS</div>
</body></html>
